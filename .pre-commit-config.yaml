repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.(svg|ipynb)$
      - id: check-yaml
        args: [--unsafe]   # mkdocs.yml uses python tags
      - id: check-added-large-files
        args: [--maxkb=1500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system   # uses the project's environment so third-party stubs resolve
        types: [python]
        pass_filenames: false
        files: ^src/
