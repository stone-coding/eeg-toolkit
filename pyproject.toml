[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eeg-toolkit"
version = "0.1.0"
description = "Toolkit for managing, accessing and analyzing human EEG data (EEGBCI motor imagery demo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stone-coding" }]
dependencies = [
  "tabulate>=0.9",
  "edfio>=0.4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "mne>=1.8,<2",
  "mne-bids>=0.16,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "sqlalchemy>=2.0,<3", "httpx>=0.27,<1"]
gui = ["streamlit>=1.35,<2"]
s3 = ["boto3>=1.34,<2"]
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5", "mypy>=1.10,<3",
  "pandas-stubs", "types-PyYAML", "pre-commit>=3.7", "python-pptx>=1.0,<2",
]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24"]
all = ["eeg-toolkit[api,gui,s3,dev,docs]"]

[project.scripts]
eegkit = "eegkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eegkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: needs the real EEGBCI download (skipped in CI)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning:mne.*"]

[tool.coverage.run]
source = ["eegkit"]
omit = ["src/eegkit/gui/*", "src/eegkit/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/eegkit"]
plugins = ["pydantic.mypy"]
