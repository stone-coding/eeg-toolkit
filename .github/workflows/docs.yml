name: Docs

# Builds the MkDocs site and publishes it (plus the coverage badge) to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,gui,s3,dev,docs]"
      - name: Coverage badge
        run: |
          pytest --cov --cov-report=xml -q
          mkdir -p docs/assets
          python scripts/make_coverage_badge.py coverage.xml docs/assets/coverage.svg
        env:
          MPLBACKEND: Agg
      - run: mkdocs gh-deploy --force --clean
